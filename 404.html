{% extends "base.html" %}

{% block title %}Page Not Found - ExpenseVault{% endblock %}
{% block page_title %}404 Not Found{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div style="font-size: 5rem; font-weight: 900; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        404
    </div>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem;">Page Not Found</h2>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">
        The requested financial resource or view could not be located.
    </p>
    <a href="{{ url_for('dashboard.view_dashboard') }}" class="btn btn-primary">
        Return to Dashboard
    </a>
</div>
{% endblock %}
