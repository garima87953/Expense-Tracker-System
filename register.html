{% extends "base.html" %}

{% block title %}Create Account - ExpenseVault{% endblock %}
{% block page_title %}Register{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <div class="card" style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">⚡</div>
            <h2 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;">Create Your Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">Take control of your personal finances today</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
            <div class="form-group">
                <label class="form-label" for="username">Username *</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required minlength="3" placeholder="e.g. alexsmith">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address *</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required placeholder="alex@example.com">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password">Password *</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="6" placeholder="Min. 6 chars">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password *</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Re-enter password">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="currency">Primary Currency</label>
                <select class="form-control" id="currency" name="currency">
                    <option value="USD">USD ($) - US Dollar</option>
                    <option value="EUR">EUR (€) - Euro</option>
                    <option value="GBP">GBP (£) - British Pound</option>
                    <option value="INR">INR (₹) - Indian Rupee</option>
                    <option value="CAD">CAD ($) - Canadian Dollar</option>
                    <option value="AUD">AUD ($) - Australian Dollar</option>
                    <option value="JPY">JPY (¥) - Japanese Yen</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">
                Create Account
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600;">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
